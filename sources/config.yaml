# gftools builder recipe: `gftools builder sources/config.yaml` builds fonts/ttf and fonts/webfonts from these UFOs.
sources:
  - NiniSans-Thin.ufo
  - NiniSans-Light.ufo
  - NiniSans-Regular.ufo
  - NiniSans-SemiBold.ufo
  - NiniSans-Bold.ufo
  - NiniSans-ThinItalic.ufo
  - NiniSans-LightItalic.ufo
  - NiniSans-Italic.ufo
  - NiniSans-SemiBoldItalic.ufo
  - NiniSans-BoldItalic.ufo
familyName: Nini Sans
buildVariable: false
buildOTF: false
autohintTTF: false
buildWebfont: false
